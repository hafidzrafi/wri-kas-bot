[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wri-kas-bot"
version = "0.1.0"
description = "Transactional dues management bot for WhatsApp with SQLite WAL outbox sync to Google Sheets"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.30",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wri_kas_bot"]

[tool.ruff]
src = ["src"]
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
