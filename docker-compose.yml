services:
  kas-wri-bot:
    build: .
    container_name: kas-wri-bot
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    networks:
      wri_network:
        aliases:
          - kas-wri-bot
          - wri-kas-bot

networks:
  wri_network:
    name: wri_network
    external: true
